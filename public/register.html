<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - DengarAI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=1.0.1">
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 min-h-100dvh">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card shadow-lg border-0"
                    style="background-color: var(--dark-blue-sec); border: 1px solid var(--border-color) !important; border-radius: 16px;">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <a href="index.html" class="text-decoration-none">
                                <h2 class="fw-bold text-light mb-0">Dengar<span
                                        style="color: var(--accent-blue);">AI</span></h2>
                            </a>
                            <p class="text-sec-custom mt-2">Buat ruang amanmu sekarang</p>
                        </div>

                        <form id="registerForm">
                            <div class="mb-3">
                                <label class="form-label text-sec-custom">Username</label>
                                <input type="text" class="form-control"
                                    style="background-color: var(--dark-blue-main); color: var(--text-main); border: 1px solid var(--border-color);"
                                    id="regUsername" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-sec-custom">Email</label>
                                <input type="email" class="form-control"
                                    style="background-color: var(--dark-blue-main); color: var(--text-main); border: 1px solid var(--border-color);"
                                    id="regEmail" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label text-sec-custom">Password</label>
                                <input type="password" class="form-control"
                                    style="background-color: var(--dark-blue-main); color: var(--text-main); border: 1px solid var(--border-color);"
                                    id="regPassword" required>
                            </div>
                            <button type="submit" class="btn btn-custom-outline w-100 rounded-pill py-2 fw-bold">Daftar
                                Sekarang</button>
                        </form>

                        <div class="text-center mt-4">
                            <span class="text-sec-custom">Sudah punya akun?</span>
                            <a href="login.html" class="text-decoration-none" style="color: var(--accent-blue);">Masuk
                                di sini</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js?v=1.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
